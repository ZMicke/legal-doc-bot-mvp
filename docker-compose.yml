services:
  backend:
    build: .
    container_name: legal_bot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://10.68.98.206:11434
      OLLAMA_MODEL: yandex/YandexGPT-5-Lite-8B-instruct-GGUF:latest
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/legal_bot
      
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./generated:/app/generated
      - ./chroma_db:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal_bot_frontend
    ports:
      - "5500:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: legal_bot_postgres
    environment:
      POSTGRES_DB: legal_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - legal_bot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_bot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  legal_bot_pgdata:
